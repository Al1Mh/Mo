
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>سایت من</title>

    <style>
        body {
            font-family: Tahoma;
            background: #f0f0f0;
            text-align: center;
            padding: 50px;
        }

        .box {
            background: white;
            padding: 30px;
            border-radius: 15px;
            max-width: 400px;
            margin: auto;
        }

        h1 {
            color: #2196F3;
        }

        button {
            background: #2196F3;

            border-radius: 8px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <div class="box">
        <h1>به سایت من خوش آمدید!</h1>
        <p>این اولین سایت ساده من است.</p>

        <button onclick="alert('سلام! خوش آمدید')">
            کلیک کن
        </button>
    </div>

</body>
</html>
